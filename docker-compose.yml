services: 
  db:
    image: postgres:15
    container_name: uav-postgres
    environment:
      POSTGRES_DB: uav_db
      POSTGRES_USER: uav_user
      POSTGRES_PASSWORD: uav_password
    ports: 
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uav_user -d uav_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api: 
    build: .
    container_name: uav-api
    ports: 
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/uav_db
      - SPRING_DATASOURCE_USERNAME=uav_user
      - SPRING_DATASOURCE_PASSWORD=uav_password
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      db: 
        condition: service_healthy  

volumes: 
  postgres_data:
